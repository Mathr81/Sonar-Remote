name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # attach the binary to a release on tag pushes

jobs:
  build:
    runs-on: windows-latest # the tray code and its tests are Windows-only
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: ./build.ps1

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - uses: actions/upload-artifact@v4
        with:
          name: sonar-remote
          path: sonar-remote.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: sonar-remote.exe
          generate_release_notes: true
